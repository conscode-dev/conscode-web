    <script>
      (function () {
        var origin = window.location.origin;
        var canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) {
          canonical = document.createElement("link");
          canonical.rel = "canonical";
          document.head.appendChild(canonical);
        }
        if (canonical) {
          canonical.href = origin + "/";
        }

        var schema = document.createElement("script");
        schema.type = "application/ld+json";
        schema.text = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "Organization",
          name: "ConsCode",
          url: origin + "/",
          logo: origin + "/ConsCode.jpeg",
          description:
            "Tim freelance web developer yang membuat website modern, cepat, responsif, dan fokus pada hasil bisnis.",
          sameAs: [
            "https://instagram.com/conscod3",
            "https://x.com/cons_dev",
            "https://tiktok.com/@conscod3",
            "https://t.me/conscode",
          ],
        });
        document.head.appendChild(schema);
      })();
    </script>

    <title>ConsCode | Jasa Pembuatan Website Profesional</title>
